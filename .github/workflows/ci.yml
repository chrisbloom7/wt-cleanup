name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install bats-core and bash 4+ (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core bash

      - name: Install bats-core (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --branch v1.11.0 --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Run tests
        run: ./run-tests

  install-smoke:
    name: Install smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install bash 4+ (macOS)
        if: runner.os == 'macOS'
        run: brew install bash

      - name: Install into a clean HOME and run --help through the symlink
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          ./install
          export PATH="${HOME}/.local/bin:${PATH}"
          wt-cleanup --help | grep -F 'Usage:'
          ./uninstall
          test ! -e "${HOME}/.local/bin/wt-cleanup"
