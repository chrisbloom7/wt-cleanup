name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18  # v1.343.0
        with:
          ruby-version: '3.3'

      - name: Install bats-core and bash 4+ (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core bash

      - name: Install bats-core (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --branch v1.11.0 --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Run tests
        run: |
          ruby --version
          ./run-tests

  install-smoke:
    name: Install smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install bash 4+ (macOS)
        if: runner.os == 'macOS'
        run: brew install bash

      - name: Install into a clean HOME and run --help through the symlink
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          ./install
          export PATH="${HOME}/.local/bin:${PATH}"
          wt-cleanup --help | grep -F 'Usage:'
          ./uninstall
          test ! -e "${HOME}/.local/bin/wt-cleanup"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck (warnings and above) on every shell script
        run: |
          set -euo pipefail
          shellcheck --version
          mapfile -t scripts < <(
            git ls-files -z | while IFS= read -r -d '' f; do
              case "${f}" in
                *.sh|*.bash) echo "${f}" ;;
                *) head -n 1 "${f}" | grep -Eq '^#!.*\b(ba|da|k)?sh\b' && echo "${f}" || true ;;
              esac
            done
          )
          printf 'Checking: %s\n' "${scripts[@]}"
          shellcheck --severity=warning "${scripts[@]}"

  # Single required-check target: fails unless every needed job succeeded
  # (a skipped or cancelled job counts as a failure).
  ci-gate:
    name: ci-gate
    needs: [test, install-smoke, shellcheck]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "::error::A required job finished with result '${r}'"
              exit 1
            fi
          done
